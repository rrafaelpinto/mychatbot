name: API Type Contract (temporary bootstrap)

on:
  pull_request:
    paths:
      - "frontend/**"
      - "chatbot/api/**"
      - ".github/workflows/api-contract.yml"

permissions:
  contents: read

jobs:
  generate-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --group dev
      - run: npm ci --prefix frontend --no-audit --no-fund
      - name: Generate OpenAPI schema and TypeScript declarations
        run: |
          uv run python manage.py spectacular --format openapi-json --file /tmp/resumebot-schema.json --settings=mychatbot.test_settings
          ./frontend/node_modules/.bin/openapi-typescript /tmp/resumebot-schema.json -o /tmp/resumebot-schema.d.ts
          echo TYPES_BEGIN
          base64 -w 120 /tmp/resumebot-schema.d.ts
          echo TYPES_END
