name: Capture README screenshots

on:
  push:
    branches:
      - "ui/**"
    paths:
      - "frontend/src/**"
      - "frontend/e2e/readme-screenshots.spec.ts"
      - ".github/workflows/readme-screenshots.yml"

permissions:
  contents: write

jobs:
  screenshots:
    if: startsWith(github.ref, 'refs/heads/ui/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Install Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Capture actual frontend states
        run: cd frontend && npx playwright test e2e/readme-screenshots.spec.ts
      - name: Commit updated README screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/resumebot-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh README screenshots"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload visual review files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resumebot-readme-screenshots
          path: |
            docs/assets/resumebot-*.jpg
            frontend/test-results/
          retention-days: 14
