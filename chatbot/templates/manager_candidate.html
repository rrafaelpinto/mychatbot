{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}- {{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <h1 class="h4 my-4">{{ title }}</h1>
        <p class="text-muted">New profiles start as private drafts pending manual platform approval. Uploaded source documents are private.</p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>
{% endblock %}
