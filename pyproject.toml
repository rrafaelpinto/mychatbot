[project]
name = "resumebot"
version = "0.1.0"
description = "AI-powered professional profiles grounded in verified candidate data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crispy-bootstrap4>=2024.10,<2027",
    "django>=5.2,<5.3",
    "django-crispy-forms>=2.3,<3",
    "django-registration>=3.4,<4",
    "gunicorn>=23,<24",
    "langchain-core>=1.7,<2",
    "openai>=1.68,<2",
    "pillow>=11,<13",
    "pgvector>=0.4,<0.5",
    "psycopg[binary]>=3.2,<4",
    "pymupdf>=1.25,<2",
    "python-docx>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.9,<5",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mychatbot.test_settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["chatbot/tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["chatbot/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
