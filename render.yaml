# Opt-in Render Blueprint. Syncing it can create a paid web service.
# Keep auto-deploy disabled until a persistent database and custom domains exist.
services:
  - type: web
    name: resumebot-api
    runtime: python
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    buildCommand: python -m pip install uv && bash scripts/build.sh
    preDeployCommand: uv run --no-sync python manage.py migrate --noinput
    startCommand: bash scripts/start.sh
    healthCheckPath: /healthz/
    envVars:
      - key: RESUMEBOT_ENV
        value: production
      - key: DJANGO_DEBUG
        value: 'false'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: API_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_TRUST_X_FORWARDED_PROTO
        value: 'true'
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: '86400'
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: 'false'
      - key: PUBLIC_REGISTRATION_ENABLED
        value: 'false'
      - key: PASSWORD_RESET_ENABLED
        value: 'false'
      - key: CANDIDATE_UPLOADS_ENABLED
        value: 'false'
      - key: AI_ENABLED
        value: 'false'
      - key: GUEST_CHAT_ENABLED
        value: 'false'
      - key: GUEST_CLEANUP_SCHEDULED
        value: 'false'

  - type: web
    name: resumebot-frontend
    runtime: static
    rootDir: frontend
    autoDeployTrigger: 'off'
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: RESUMEBOT_BUILD_TARGET
        value: production
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
